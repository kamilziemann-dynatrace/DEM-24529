<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Same-Origin iFrame Content</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #FAFAFA; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin: 5px; }
        img { max-width: 100%; height: auto; margin: 10px 0; }
        pre { background: #f0f0f0; padding: 8px; border-radius: 4px; font-size: 12px; overflow-x: auto; }
        #iframe-dynamic { margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Same-Origin iFrame Content</h2>

    <!-- AUTO: image loaded inside iframe -->
    <img src="https://www.gstatic.com/webp/gallery/1.webp" alt="WebP auto-load inside iframe">

    <div>
        <button id="btn-iframe-alert">Click Me</button>
        <button id="btn-iframe-fetch">Fetch Data</button>
        <button id="btn-iframe-add-image">Add Image</button>
    </div>

    <div id="iframe-dynamic"></div>

    <script>
        // AUTO: fetch on iframe load — /users/1
        fetch("https://jsonplaceholder.typicode.com/users/1")
            .then(r => r.json())
            .then(data => {
                document.getElementById("iframe-dynamic").insertAdjacentHTML(
                    "beforeend",
                    "<p><em>Auto-loaded user:</em> " + data.name + " (" + data.email + ")</p>"
                );
            });

        // ON-CLICK: alert
        document.getElementById("btn-iframe-alert").addEventListener("click", function () {
            alert("Button inside same-origin iframe clicked!");
        });

        // ON-CLICK: fetch /albums/1
        document.getElementById("btn-iframe-fetch").addEventListener("click", function () {
            fetch("https://jsonplaceholder.typicode.com/albums/1")
                .then(r => r.json())
                .then(data => {
                    document.getElementById("iframe-dynamic").insertAdjacentHTML(
                        "beforeend",
                        "<pre>Fetched album: " + JSON.stringify(data, null, 2) + "</pre>"
                    );
                });
        });

        // ON-CLICK: add dynamic image
        document.getElementById("btn-iframe-add-image").addEventListener("click", function () {
            const img = document.createElement("img");
            img.src = "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=400&auto=format&fit=crop";
            img.alt = "Dynamically loaded inside iframe";
            document.getElementById("iframe-dynamic").appendChild(img);
        });
    </script>
</body>
</html>
