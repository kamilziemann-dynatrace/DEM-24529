<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Origin iFrame with Resources</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        iframe {
            border: 2px solid #333;
            margin: 20px 0;
            width: 100%;
            height: 400px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        #img-container {
            text-align: center;
            margin: 20px 0;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #1565C0;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
        .actions { margin: 20px 0; }
        #dynamic-content { margin: 20px 0; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">← Back to all scenarios</a>
    <h1>1. Cross-Origin iFrame with Resources</h1>

    <!-- AUTO: images loaded on page load -->
    <div id="img-container">
        <h2>Auto-loaded Images</h2>
        <img src="https://images.unsplash.com/photo-1548620848-d375c7919ea2?q=80&w=1738&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Unsplash auto-load">
        <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="25" y="25" width="50" height="50" fill="#FF5722" rx="5"/>
            <circle cx="50" cy="50" r="15" fill="#FFF"/>
        </svg>
        <img src="https://www.gstatic.com/webp/gallery/1.webp" alt="WebP auto-load">
    </div>

    <!-- AUTO: cross-origin iframe loaded on page load -->
    <div id="iframe-container">
        <h2>Cross-Origin iFrame (CodePen)</h2>
        <iframe id="cross-origin-iframe"
            src="https://codepen.io/agatajackiewicz-dynatrace/fullembedgrid/jEqgrxa?animations=run&type=embed"
        ></iframe>
    </div>

    <!-- INTERACTIVE: buttons that trigger resources on click -->
    <div class="actions">
        <h2>Interactive Actions</h2>
        <button id="btn-fetch-todo" onclick="fetchTodo()">Fetch Todo</button>
        <button id="btn-load-image" onclick="loadImage()">Load Image</button>
        <button id="btn-send-xhr" onclick="sendXhr()">Send XHR</button>
    </div>

    <div id="dynamic-content"></div>

    <script>
        // AUTO: fetch on page load
        fetch("https://jsonplaceholder.typicode.com/posts/1")
            .then(r => r.json())
            .then(data => {
                document.getElementById("dynamic-content").insertAdjacentHTML(
                    "beforeend",
                    "<p><em>Auto-loaded post:</em> " + data.title + "</p>"
                );
            });

        // ON-CLICK: fetch /todos/2
        function fetchTodo() {
            fetch("https://jsonplaceholder.typicode.com/todos/2")
                .then(r => r.json())
                .then(data => {
                    document.getElementById("dynamic-content").insertAdjacentHTML(
                        "beforeend",
                        "<pre>Fetched todo: " + JSON.stringify(data, null, 2) + "</pre>"
                    );
                });
        }

        // ON-CLICK: load dynamic image
        function loadImage() {
            const img = document.createElement("img");
            img.src = "https://picsum.photos/400/300?random=" + Date.now();
            img.alt = "Dynamically loaded image";
            img.style.marginTop = "10px";
            document.getElementById("dynamic-content").appendChild(img);
        }

        // ON-CLICK: XHR /comments/1
        function sendXhr() {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "https://jsonplaceholder.typicode.com/comments/1");
            xhr.onload = function () {
                document.getElementById("dynamic-content").insertAdjacentHTML(
                    "beforeend",
                    "<pre>XHR comment: " + xhr.responseText.substring(0, 200) + "...</pre>"
                );
            };
            xhr.send();
        }
    </script>
</body>
</html>
