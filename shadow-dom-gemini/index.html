<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Enterprise - Shadow DOM Reproduction</title>
    <style>
        :root {
            --ink: #1f2937;
            --muted: #657184;
            --line: #dbe2ea;
            --blue: #2563eb;
            --blue-soft: #e8f0ff;
            --cream: #fffdf8;
            --coral: #e47d5a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 320px;
            color: var(--ink);
            font-family: "Avenir Next", "Segoe UI", sans-serif;
            background:
                linear-gradient(rgba(37, 99, 235, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(37, 99, 235, 0.035) 1px, transparent 1px),
                linear-gradient(135deg, #eef4ff 0%, #f8f5ef 48%, #ffffff 100%);
            background-size: 32px 32px, 32px 32px, auto;
        }

        .page-shell {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 52px;
        }

        .back-link {
            color: var(--blue);
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }

        .page-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            margin: 42px 0 20px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--coral);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 680px;
            margin: 0;
            font-size: clamp(30px, 5vw, 58px);
            line-height: 0.98;
            letter-spacing: 0;
        }

        .page-heading p {
            max-width: 360px;
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .reproduction-frame {
            overflow: hidden;
            border: 1px solid rgba(31, 41, 55, 0.12);
            border-radius: 10px;
            background: var(--cream);
            box-shadow: 0 22px 60px rgba(31, 41, 55, 0.12);
        }

        gemini-app {
            display: block;
            min-height: 610px;
        }

        .repro-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 24px;
            padding: 14px 18px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.72);
        }

        .repro-meta strong { color: var(--ink); }

        .repro-meta code {
            padding: 3px 6px;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: #334155;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
            background: #f8fafc;
        }

        @media (max-width: 700px) {
            .page-shell { width: min(100% - 24px, 1120px); padding-top: 18px; }
            .page-heading { display: block; margin-top: 32px; }
            .page-heading p { margin-top: 16px; }
            gemini-app { min-height: 680px; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <a class="back-link" href="../index.html">Back to all scenarios</a>

        <div class="page-heading">
            <div>
                <p class="eyebrow">DEM-24529 / public reproduction</p>
                <h1>Gemini Enterprise</h1>
            </div>
            <p>A small Gemini-like chat surface whose search editor is nested four levels deep inside open shadow DOM.</p>
        </div>

        <section class="reproduction-frame" aria-label="Gemini Enterprise reproduction">
            <gemini-app id="gemini-app"></gemini-app>
            <div class="repro-meta">
                <span><strong>Target:</strong> <code>.ProseMirror[contenteditable="true"]</code></span>
                <span><strong>Shadow roots:</strong> 4 open</span>
            </div>
        </section>
    </div>

    <script>
        class ProseMirrorEditor extends HTMLElement {
            connectedCallback() {
                const shadowRoot = this.attachShadow({ mode: "open", delegatesFocus: true });
                shadowRoot.innerHTML = `
                    <style>
                        :host {
                            display: block;
                            min-width: 0;
                            flex: 1 1 auto;
                        }

                        .editor-resize-container {
                            min-height: 52px;
                            display: flex;
                            align-items: center;
                        }

                        .ProseMirror {
                            width: 100%;
                            min-height: 32px;
                            max-height: 150px;
                            overflow-y: auto;
                            padding: 9px 2px;
                            outline: 0;
                            color: #1f2937;
                            font: inherit;
                            font-size: 15px;
                            line-height: 1.45;
                            white-space: pre-wrap;
                            word-break: break-word;
                        }

                        .ProseMirror p { margin: 0; }

                        .placeholder {
                            color: #8a96a6;
                            pointer-events: none;
                            user-select: none;
                        }
                    </style>
                    <div class="editor-resize-container">
                        <div class="ProseMirror" contenteditable="true" translate="no" role="textbox" aria-label="Search" data-testid="prosemirror-editor">
                            <p><span class="placeholder ProseMirror-widget" contenteditable="false">Ask Gemini Enterprise</span><br class="ProseMirror-trailingBreak"></p>
                        </div>
                    </div>
                `;

                this.editor = shadowRoot.querySelector(".ProseMirror");
                this.editor.addEventListener("focus", () => this.prepareForInput());
                this.editor.addEventListener("blur", () => this.restorePlaceholder());
                this.editor.addEventListener("input", () => this.handleInput());
                this.editor.addEventListener("keydown", event => {
                    if (event.key === "Enter" && !event.shiftKey) {
                        event.preventDefault();
                        this.dispatchEvent(new CustomEvent("editor-submit", { bubbles: true, composed: true }));
                    }
                });
            }

            getValue() {
                const clone = this.editor.cloneNode(true);
                const placeholder = clone.querySelector(".placeholder");
                if (placeholder) placeholder.remove();
                return clone.textContent.replace(/\u00a0/g, " ").trim();
            }

            prepareForInput() {
                if (this.getValue()) return;

                const paragraph = this.editor.querySelector("p");
                paragraph.innerHTML = "<br class=\"ProseMirror-trailingBreak\">";
                const range = document.createRange();
                range.selectNodeContents(paragraph);
                range.collapse(true);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
            }

            restorePlaceholder() {
                if (this.getValue()) return;
                this.editor.innerHTML = "<p><span class=\"placeholder ProseMirror-widget\" contenteditable=\"false\">Ask Gemini Enterprise</span><br class=\"ProseMirror-trailingBreak\"></p>";
            }

            handleInput() {
                this.dispatchEvent(new CustomEvent("editor-input", {
                    bubbles: true,
                    composed: true,
                    detail: { value: this.getValue() }
                }));
            }

            clear() {
                this.editor.innerHTML = "<p><br class=\"ProseMirror-trailingBreak\"></p>";
                this.handleInput();
                this.editor.focus();
            }
        }

        class SearchBar extends HTMLElement {
            connectedCallback() {
                const shadowRoot = this.attachShadow({ mode: "open", delegatesFocus: true });
                shadowRoot.innerHTML = `
                    <style>
                        :host { display: block; }

                        .search-bar-wrapper {
                            position: relative;
                            padding: 18px;
                        }

                        .search-bar-glow {
                            position: absolute;
                            inset: 9px 12px;
                            border-radius: 22px;
                            background: linear-gradient(110deg, rgba(37, 99, 235, 0.12), rgba(228, 125, 90, 0.1));
                            filter: blur(12px);
                            pointer-events: none;
                        }

                        form {
                            position: relative;
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            min-height: 76px;
                            padding: 9px 10px 9px 15px;
                            border: 1px solid #cfd8e3;
                            border-radius: 18px;
                            background: #ffffff;
                            box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
                            transition: border-color 0.18s ease, box-shadow 0.18s ease;
                        }

                        form:focus-within {
                            border-color: #7da5f7;
                            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1), 0 8px 24px rgba(31, 41, 55, 0.08);
                        }

                        .prefix-icon {
                            display: grid;
                            place-items: center;
                            width: 28px;
                            height: 28px;
                            flex: 0 0 28px;
                            border-radius: 9px;
                            color: #ffffff;
                            font-size: 15px;
                            font-weight: 800;
                            background: linear-gradient(145deg, #2563eb, #7c9ff4);
                        }

                        .actions {
                            display: flex;
                            align-items: center;
                            gap: 6px;
                            flex: 0 0 auto;
                        }

                        button {
                            border: 0;
                            font: inherit;
                            cursor: pointer;
                        }

                        .file-button {
                            width: 34px;
                            height: 34px;
                            border-radius: 50%;
                            color: #526174;
                            font-size: 22px;
                            line-height: 1;
                            background: #eef2f7;
                        }

                        .file-button:hover { background: #e3e9f1; }

                        .send-button {
                            min-width: 68px;
                            min-height: 36px;
                            padding: 8px 13px;
                            border-radius: 11px;
                            color: #ffffff;
                            font-size: 13px;
                            font-weight: 700;
                            background: #2563eb;
                        }

                        .send-button:hover:not(:disabled) { background: #1d4ed8; }

                        .send-button:disabled {
                            cursor: not-allowed;
                            opacity: 0.42;
                        }

                        .status {
                            min-height: 18px;
                            margin: 8px 4px 0;
                            color: #7b8797;
                            font-size: 11px;
                        }

                        @media (max-width: 520px) {
                            form { min-height: 86px; align-items: flex-end; }
                            .prefix-icon { align-self: center; }
                            .actions { padding-bottom: 4px; }
                        }
                    </style>
                    <div class="search-bar-wrapper">
                        <div class="search-bar-glow" aria-hidden="true"></div>
                        <form role="search" aria-label="Gemini search">
                            <div class="prefix-icon" aria-hidden="true">&#10022;</div>
                            <ucs-prosemirror-editor id="agent-search-prosemirror-editor" class="prosemirror-editor" aria-label="Search"></ucs-prosemirror-editor>
                            <div class="actions">
                                <button class="file-button" type="button" aria-label="Add files" title="Add files">+</button>
                                <button class="send-button" type="submit" disabled>Send</button>
                            </div>
                        </form>
                        <p class="status" aria-live="polite">Ready</p>
                    </div>
                `;

                this.editor = shadowRoot.querySelector("ucs-prosemirror-editor");
                this.form = shadowRoot.querySelector("form");
                this.sendButton = shadowRoot.querySelector(".send-button");
                this.status = shadowRoot.querySelector(".status");
                this.form.addEventListener("submit", event => {
                    event.preventDefault();
                    this.submitQuery();
                });
                this.editor.addEventListener("editor-input", event => {
                    const hasValue = Boolean(event.detail.value.trim());
                    this.sendButton.disabled = !hasValue;
                    this.status.textContent = hasValue ? "Message ready" : "Ready";
                });
                this.editor.addEventListener("editor-submit", () => this.submitQuery());
                shadowRoot.querySelector(".file-button").addEventListener("click", () => {
                    this.status.textContent = "File picker is outside this reproduction";
                });
            }

            submitQuery() {
                const text = this.editor.getValue();
                if (!text) {
                    this.editor.focus();
                    return;
                }

                this.dispatchEvent(new CustomEvent("chat-submit", {
                    bubbles: true,
                    composed: true,
                    detail: { text }
                }));
                this.editor.clear();
                this.status.textContent = "Sent";
            }
        }

        class ChatLanding extends HTMLElement {
            connectedCallback() {
                const shadowRoot = this.attachShadow({ mode: "open" });
                shadowRoot.innerHTML = `
                    <style>
                        :host { display: block; }

                        .landing {
                            min-height: 530px;
                            padding: 34px clamp(18px, 6vw, 74px) 46px;
                            background:
                                linear-gradient(180deg, rgba(255, 253, 248, 0.82), rgba(246, 249, 255, 0.8)),
                                #fffdf8;
                        }

                        .greeting {
                            max-width: 760px;
                            margin: 0 auto;
                            padding: 24px 0 4px;
                            text-align: center;
                        }

                        .logo-mark {
                            display: inline-grid;
                            place-items: center;
                            width: 60px;
                            height: 60px;
                            margin-bottom: 14px;
                            border: 1px solid rgba(37, 99, 235, 0.18);
                            border-radius: 20px;
                            color: #2563eb;
                            font-size: 28px;
                            background: #edf3ff;
                        }

                        h2 {
                            margin: 0;
                            color: #1f2937;
                            font-size: clamp(26px, 4vw, 40px);
                            font-weight: 650;
                            letter-spacing: 0;
                        }

                        .greeting-prompt {
                            margin: 10px 0 0;
                            color: #718096;
                            font-size: 15px;
                        }

                        ucs-search-bar {
                            display: block;
                            max-width: 820px;
                            margin: 56px auto 0;
                        }

                        .conversation {
                            max-width: 820px;
                            margin: 2px auto 0;
                        }

                        .message {
                            margin: 14px 18px 0 auto;
                            padding: 12px 15px;
                            border: 1px solid #d9e5fb;
                            border-radius: 14px 14px 4px 14px;
                            color: #24477d;
                            font-size: 14px;
                            line-height: 1.5;
                            background: #f0f5ff;
                        }

                        .reply {
                            margin: 9px 18px 0;
                            padding: 12px 15px;
                            border-left: 3px solid #e47d5a;
                            color: #657184;
                            font-size: 13px;
                            line-height: 1.5;
                            background: rgba(255, 255, 255, 0.7);
                        }
                    </style>
                    <section class="landing">
                        <div class="greeting">
                            <div class="logo-mark" aria-hidden="true">&#10022;</div>
                            <h2>Hello, there</h2>
                            <p class="greeting-prompt">Let's get some work done.</p>
                        </div>
                        <ucs-search-bar data-test-id="agent-search-bar"></ucs-search-bar>
                        <div class="conversation" aria-live="polite"></div>
                    </section>
                `;
            }

            showResponse(text) {
                const conversation = this.shadowRoot.querySelector(".conversation");
                const message = document.createElement("div");
                message.className = "message";
                message.textContent = text;
                const reply = document.createElement("div");
                reply.className = "reply";
                reply.textContent = "Message received by the shadow-DOM reproduction.";
                conversation.append(message, reply);
            }
        }

        class GeminiApp extends HTMLElement {
            connectedCallback() {
                const shadowRoot = this.attachShadow({ mode: "open" });
                shadowRoot.innerHTML = `
                    <style>
                        :host { display: block; }

                        .app-shell {
                            min-height: 610px;
                            color: #1f2937;
                            background: #fffdf8;
                        }

                        header {
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            gap: 20px;
                            min-height: 66px;
                            padding: 0 24px;
                            border-bottom: 1px solid #e5e9ef;
                            background: rgba(255, 255, 255, 0.84);
                        }

                        .brand {
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            font-size: 16px;
                            font-weight: 700;
                            letter-spacing: 0;
                        }

                        .brand-mark {
                            display: grid;
                            place-items: center;
                            width: 27px;
                            height: 27px;
                            border-radius: 9px;
                            color: #ffffff;
                            font-size: 14px;
                            background: #2563eb;
                        }

                        nav {
                            display: flex;
                            align-items: center;
                            gap: 8px;
                            color: #718096;
                            font-size: 12px;
                        }

                        nav span { padding: 6px 9px; }

                        .profile {
                            display: grid;
                            place-items: center;
                            width: 32px;
                            height: 32px;
                            border-radius: 50%;
                            color: #24477d;
                            font-size: 12px;
                            font-weight: 700;
                            background: #dbeafe;
                        }

                        main { display: block; }

                        footer {
                            padding: 0 24px 18px;
                            color: #96a0ae;
                            font-size: 11px;
                            text-align: center;
                        }

                        @media (max-width: 520px) {
                            header { padding: 0 16px; }
                            nav span { display: none; }
                            .app-shell { min-height: 680px; }
                        }
                    </style>
                    <div class="app-shell">
                        <header>
                            <div class="brand"><span class="brand-mark" aria-hidden="true">&#10022;</span>Gemini Enterprise</div>
                            <nav aria-label="Application navigation"><span>Home</span><span>Saved</span><span class="profile" aria-label="Profile">GE</span></nav>
                        </header>
                        <main><ucs-chat-landing></ucs-chat-landing></main>
                        <footer>Responses in this page are local and synthetic.</footer>
                    </div>
                `;

                shadowRoot.addEventListener("chat-submit", event => {
                    event.stopPropagation();
                    shadowRoot.querySelector("ucs-chat-landing").showResponse(event.detail.text);
                });
            }
        }

        customElements.define("ucs-prosemirror-editor", ProseMirrorEditor);
        customElements.define("ucs-search-bar", SearchBar);
        customElements.define("ucs-chat-landing", ChatLanding);
        customElements.define("gemini-app", GeminiApp);

        window.findOpenShadowElement = function findOpenShadowElement(selector, root = document) {
            const directMatch = root.querySelector(selector);
            if (directMatch) return directMatch;

            for (const element of root.querySelectorAll("*")) {
                if (!element.shadowRoot) continue;
                const nestedMatch = window.findOpenShadowElement(selector, element.shadowRoot);
                if (nestedMatch) return nestedMatch;
            }

            return null;
        };
    </script>
</body>
</html>
