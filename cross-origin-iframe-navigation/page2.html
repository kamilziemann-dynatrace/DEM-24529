<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Origin iFrame Navigation — Page 2</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        iframe { border: 2px solid #333; margin: 20px 0; width: 100%; height: 400px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        img { max-width: 100%; height: auto; margin: 10px 0; }
        nav { background: #333; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
        nav a { color: #fff; text-decoration: none; padding: 8px 16px; margin: 0 4px; border-radius: 4px; }
        nav a:hover, nav a.active { background: #4CAF50; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #1565C0; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        .actions { margin: 20px 0; }
        #dynamic-content { margin: 20px 0; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">← Back to all scenarios</a>
    <h1>3. Cross-Origin iFrame Navigation</h1>

    <nav>
        <a id="nav-page1" href="index.html">Page 1</a>
        <a id="nav-page2" href="page2.html" class="active">Page 2</a>
        <a id="nav-page3" href="page3.html">Page 3</a>
    </nav>

    <h2>Page 2 — Cross-Origin iFrame (CodePen)</h2>

    <!-- AUTO: image -->
    <img src="https://www.gstatic.com/webp/gallery/1.webp" alt="WebP auto-load">

    <!-- AUTO: cross-origin iframe (codepen) -->
    <iframe id="cross-origin-iframe" src="https://codepen.io/agatajackiewicz-dynatrace/fullembedgrid/jEqgrxa?animations=run&type=embed"></iframe>

    <!-- INTERACTIVE -->
    <div class="actions">
        <button id="btn-send-xhr">Send XHR</button>
        <button id="btn-change-bg">Change Background</button>
        <button id="btn-load-svg">Load SVG</button>
    </div>

    <div id="dynamic-content"></div>

    <script>
        // AUTO: fetch on page load — /users/1
        fetch("https://jsonplaceholder.typicode.com/users/1")
            .then(r => r.json())
            .then(data => {
                document.getElementById("dynamic-content").insertAdjacentHTML(
                    "beforeend",
                    "<p><em>Auto-loaded user:</em> " + data.name + " — " + data.company.name + "</p>"
                );
            });

        // ON-CLICK: XHR /comments/1
        document.getElementById("btn-send-xhr").addEventListener("click", function () {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://jsonplaceholder.typicode.com/comments/1");
            xhr.onload = function () {
                var data = JSON.parse(xhr.responseText);
                document.getElementById("dynamic-content").insertAdjacentHTML(
                    "beforeend",
                    "<pre>XHR comment:\nName: " + data.name + "\nEmail: " + data.email + "</pre>"
                );
            };
            xhr.send();
        });

        // ON-CLICK: toggle background color
        var bgToggle = false;
        document.getElementById("btn-change-bg").addEventListener("click", function () {
            bgToggle = !bgToggle;
            document.body.style.backgroundColor = bgToggle ? "#FFF3E0" : "";
        });

        // ON-CLICK: dynamically insert SVG
        document.getElementById("btn-load-svg").addEventListener("click", function () {
            document.getElementById("dynamic-content").insertAdjacentHTML(
                "beforeend",
                '<svg width="200" height="100" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" style="margin:10px 0;">' +
                '<rect width="200" height="100" fill="#E8F5E9" rx="8"/>' +
                '<circle cx="50" cy="50" r="30" fill="#4CAF50"/>' +
                '<circle cx="120" cy="50" r="25" fill="#2196F3"/>' +
                '<circle cx="175" cy="50" r="20" fill="#FF9800"/>' +
                '</svg>'
            );
        });
    </script>
</body>
</html>
