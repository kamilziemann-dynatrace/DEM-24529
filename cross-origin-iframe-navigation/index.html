<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Origin iFrame Navigation — Page 1</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        iframe { border: 2px solid #333; margin: 20px 0; width: 100%; height: 400px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        img { max-width: 100%; height: auto; margin: 10px 0; }
        nav { background: #333; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
        nav a { color: #fff; text-decoration: none; padding: 8px 16px; margin: 0 4px; border-radius: 4px; }
        nav a:hover, nav a.active { background: #4CAF50; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #1565C0; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        .actions { margin: 20px 0; }
        #dynamic-content { margin: 20px 0; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">← Back to all scenarios</a>
    <h1>3. Cross-Origin iFrame Navigation</h1>

    <nav>
        <a id="nav-page1" href="index.html" class="active">Page 1</a>
        <a id="nav-page2" href="page2.html">Page 2</a>
        <a id="nav-page3" href="page3.html">Page 3</a>
    </nav>

    <h2>Page 1 — Cross-Origin iFrame (DEM-19149)</h2>

    <!-- AUTO: image -->
    <img src="https://images.unsplash.com/photo-1548620848-d375c7919ea2?q=80&w=800&auto=format&fit=crop" alt="Unsplash auto-load">

    <!-- AUTO: cross-origin iframe -->
    <iframe id="cross-origin-iframe" src="https://kasiagd.github.io/DEM-19149/cross-origin-iframe-with-resources/"></iframe>

    <!-- INTERACTIVE -->
    <div class="actions">
        <button id="btn-fetch-todo">Fetch Todo</button>
        <button id="btn-load-gallery">Load Gallery</button>
    </div>

    <div id="dynamic-content"></div>

    <script>
        // AUTO: fetch on page load — /posts/1
        fetch("https://jsonplaceholder.typicode.com/posts/1")
            .then(r => r.json())
            .then(data => {
                document.getElementById("dynamic-content").insertAdjacentHTML(
                    "beforeend",
                    "<p><em>Auto-loaded post:</em> " + data.title + "</p>"
                );
            });

        // ON-CLICK: fetch /todos/2
        document.getElementById("btn-fetch-todo").addEventListener("click", function () {
            fetch("https://jsonplaceholder.typicode.com/todos/2")
                .then(r => r.json())
                .then(data => {
                    document.getElementById("dynamic-content").insertAdjacentHTML(
                        "beforeend",
                        "<pre>Fetched todo: " + JSON.stringify(data, null, 2) + "</pre>"
                    );
                });
        });

        // ON-CLICK: load gallery images
        document.getElementById("btn-load-gallery").addEventListener("click", function () {
            var container = document.getElementById("dynamic-content");
            var img1 = document.createElement("img");
            img1.src = "https://picsum.photos/400/250?random=" + Date.now();
            img1.alt = "Gallery image 1";
            container.appendChild(img1);

            var img2 = document.createElement("img");
            img2.src = "https://www.gstatic.com/webp/gallery/2.webp";
            img2.alt = "Gallery image 2";
            container.appendChild(img2);
        });
    </script>
</body>
</html>
