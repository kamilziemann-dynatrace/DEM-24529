<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local iFrame Content</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #FAFAFA; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin: 5px; }
        img { max-width: 100%; height: auto; margin: 10px 0; }
        pre { background: #f0f0f0; padding: 8px; border-radius: 4px; font-size: 12px; overflow-x: auto; }
        #frame-dynamic { margin-top: 10px; }
        .added-element { background: #E3F2FD; border: 1px solid #90CAF9; padding: 10px; margin: 5px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <h3>Same-Origin iFrame Content</h3>

    <!-- AUTO: image -->
    <img src="https://www.gstatic.com/webp/gallery/1.webp" alt="WebP auto-load in local frame">

    <div>
        <button id="btn-frame-refresh">Refresh Data</button>
        <button id="btn-frame-add-element">Add Element</button>
    </div>

    <div id="frame-dynamic"></div>

    <script>
        // AUTO: fetch on load — /users/1
        fetch("https://jsonplaceholder.typicode.com/users/1")
            .then(r => r.json())
            .then(data => {
                document.getElementById("frame-dynamic").insertAdjacentHTML(
                    "beforeend",
                    "<p><em>Auto-loaded user:</em> " + data.name + " (" + data.email + ")</p>"
                );
            });

        // ON-CLICK: fetch /todos/2
        document.getElementById("btn-frame-refresh").addEventListener("click", function () {
            fetch("https://jsonplaceholder.typicode.com/todos/2")
                .then(r => r.json())
                .then(data => {
                    document.getElementById("frame-dynamic").insertAdjacentHTML(
                        "beforeend",
                        "<pre>Refreshed todo: " + JSON.stringify(data, null, 2) + "</pre>"
                    );
                });
        });

        // ON-CLICK: add styled DOM elements
        var elementCount = 0;
        document.getElementById("btn-frame-add-element").addEventListener("click", function () {
            elementCount++;
            var el = document.createElement("div");
            el.className = "added-element";
            el.textContent = "Dynamically added element #" + elementCount + " — " + new Date().toLocaleTimeString();
            document.getElementById("frame-dynamic").appendChild(el);
        });
    </script>
</body>
</html>
