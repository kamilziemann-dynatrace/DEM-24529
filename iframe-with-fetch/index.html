<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFrame with Heavy Fetch Activity</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        iframe { border: 2px solid #333; margin: 10px 0; width: 100%; height: 300px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        img { max-width: 100%; height: auto; margin: 10px 0; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #1565C0; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        .actions { margin: 20px 0; }
        #dynamic-content { margin: 20px 0; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .iframe-label { font-weight: bold; margin-top: 20px; color: #333; }
        .auto-data { background: #E8F5E9; padding: 10px; border-radius: 4px; margin: 5px 0; }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">← Back to all scenarios</a>
    <h1>6. iFrame with Heavy Fetch Activity</h1>

    <!-- AUTO: images -->
    <img src="https://images.unsplash.com/photo-1548620848-d375c7919ea2?q=80&w=800&auto=format&fit=crop" alt="Unsplash auto-load">
    <img src="https://www.gstatic.com/webp/gallery/1.webp" alt="WebP auto-load">

    <!-- AUTO: same-origin iframe with fetch -->
    <p class="iframe-label">Same-Origin iFrame (with own fetch activity):</p>
    <iframe id="same-origin-iframe" src="fetch-frame.html"></iframe>

    <!-- AUTO: cross-origin iframe -->
    <p class="iframe-label">Cross-Origin iFrame (DEM-19149):</p>
    <iframe id="cross-origin-iframe" src="https://kasiagd.github.io/DEM-19149/cross-origin-iframe-with-resources/"></iframe>

    <!-- INTERACTIVE -->
    <div class="actions">
        <button id="btn-parent-fetch">Parent Fetch</button>
        <button id="btn-parent-xhr">Parent XHR</button>
        <button id="btn-parent-load-image">Load Image</button>
    </div>

    <div id="auto-results"></div>
    <div id="dynamic-content"></div>

    <script>
        // AUTO: fetch on page load — /posts/1
        fetch("https://jsonplaceholder.typicode.com/posts/1")
            .then(r => r.json())
            .then(data => {
                document.getElementById("auto-results").insertAdjacentHTML(
                    "beforeend",
                    '<div class="auto-data"><em>Auto fetch /posts/1:</em> ' + data.title + '</div>'
                );
            });

        // AUTO: XHR on page load — /users/1
        var autoXhr = new XMLHttpRequest();
        autoXhr.open("GET", "https://jsonplaceholder.typicode.com/users/1");
        autoXhr.onload = function () {
            var data = JSON.parse(autoXhr.responseText);
            document.getElementById("auto-results").insertAdjacentHTML(
                "beforeend",
                '<div class="auto-data"><em>Auto XHR /users/1:</em> ' + data.name + ' — ' + data.email + '</div>'
            );
        };
        autoXhr.send();

        // ON-CLICK: fetch /albums/1
        document.getElementById("btn-parent-fetch").addEventListener("click", function () {
            fetch("https://jsonplaceholder.typicode.com/albums/1")
                .then(r => r.json())
                .then(data => {
                    document.getElementById("dynamic-content").insertAdjacentHTML(
                        "beforeend",
                        "<pre>Parent fetched album: " + JSON.stringify(data, null, 2) + "</pre>"
                    );
                });
        });

        // ON-CLICK: XHR /photos/1
        document.getElementById("btn-parent-xhr").addEventListener("click", function () {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://jsonplaceholder.typicode.com/photos/1");
            xhr.onload = function () {
                var data = JSON.parse(xhr.responseText);
                document.getElementById("dynamic-content").insertAdjacentHTML(
                    "beforeend",
                    "<pre>Parent XHR photo: " + data.title + "\nURL: " + data.url + "</pre>"
                );
            };
            xhr.send();
        });

        // ON-CLICK: load dynamic image
        document.getElementById("btn-parent-load-image").addEventListener("click", function () {
            var img = document.createElement("img");
            img.src = "https://picsum.photos/400/250?random=" + Date.now();
            img.alt = "Dynamically loaded from parent";
            document.getElementById("dynamic-content").appendChild(img);
        });
    </script>
</body>
</html>
