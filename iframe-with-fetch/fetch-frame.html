<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch iFrame Content</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #FAFAFA; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin: 5px; }
        img { max-width: 100%; height: auto; margin: 10px 0; }
        pre { background: #f0f0f0; padding: 8px; border-radius: 4px; font-size: 12px; overflow-x: auto; }
        .auto-data { background: #FFF3E0; padding: 8px; border-radius: 4px; margin: 5px 0; font-size: 13px; }
        #frame-dynamic { margin-top: 10px; }
    </style>
</head>
<body>
    <h3>Fetch iFrame Content</h3>
    <p>This iframe actively fetches data on load and has interactive buttons.</p>

    <!-- AUTO: image -->
    <img src="https://www.gstatic.com/webp/gallery/1.webp" alt="WebP auto-load in fetch frame">

    <div id="auto-results"></div>

    <div>
        <button id="btn-frame-xhr">XHR Request</button>
        <button id="btn-frame-fetch-comments">Fetch Comments</button>
        <button id="btn-frame-load-image">Load CDN Image</button>
    </div>

    <div id="frame-dynamic"></div>

    <script>
        // AUTO: fetch on load — /todos/1
        fetch("https://jsonplaceholder.typicode.com/todos/1")
            .then(r => r.json())
            .then(data => {
                document.getElementById("auto-results").insertAdjacentHTML(
                    "beforeend",
                    '<div class="auto-data"><em>Auto fetch /todos/1:</em> ' + data.title + ' (completed: ' + data.completed + ')</div>'
                );
            });

        // ON-CLICK: XHR /comments/1
        document.getElementById("btn-frame-xhr").addEventListener("click", function () {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://jsonplaceholder.typicode.com/comments/1");
            xhr.onload = function () {
                var data = JSON.parse(xhr.responseText);
                document.getElementById("frame-dynamic").insertAdjacentHTML(
                    "beforeend",
                    "<pre>Frame XHR comment:\n" + data.name + "\n" + data.email + "</pre>"
                );
            };
            xhr.send();
        });

        // ON-CLICK: fetch /comments?postId=1
        document.getElementById("btn-frame-fetch-comments").addEventListener("click", function () {
            fetch("https://jsonplaceholder.typicode.com/comments?postId=1")
                .then(r => r.json())
                .then(comments => {
                    var html = "<h4>Comments for post 1:</h4><ul>";
                    comments.forEach(function (c) {
                        html += "<li><strong>" + c.name + "</strong> (" + c.email + ")</li>";
                    });
                    html += "</ul>";
                    document.getElementById("frame-dynamic").insertAdjacentHTML("beforeend", html);
                });
        });

        // ON-CLICK: load dynamic image
        document.getElementById("btn-frame-load-image").addEventListener("click", function () {
            var img = document.createElement("img");
            img.src = "https://picsum.photos/350/200?random=" + Date.now();
            img.alt = "CDN image loaded from iframe";
            document.getElementById("frame-dynamic").appendChild(img);
        });
    </script>
</body>
</html>
