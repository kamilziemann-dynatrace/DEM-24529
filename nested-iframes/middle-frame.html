<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Middle iFrame</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #F5F5F5; }
        iframe { border: 2px solid #666; margin: 10px 0; width: 100%; height: 250px; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin: 5px; }
        img { max-width: 100%; height: auto; margin: 10px 0; }
        pre { background: #e8e8e8; padding: 8px; border-radius: 4px; font-size: 12px; overflow-x: auto; }
        .level-indicator { background: #FFF3E0; border-left: 4px solid #FF9800; padding: 8px 12px; margin: 8px 0; }
        #middle-dynamic { margin-top: 10px; }
        .hidden { display: none; }
        .extra-content { background: #E3F2FD; padding: 10px; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="level-indicator"><strong>Level 1 — Middle iFrame</strong> (same-origin)</div>

    <!-- AUTO: image -->
    <img src="https://www.gstatic.com/webp/gallery/1.webp" alt="WebP auto-load in middle frame">

    <!-- AUTO: inner iframe — same-origin -->
    <h3>Inner iFrame (same-origin local test)</h3>
    <iframe id="inner-iframe" src="inner-frame.html"></iframe>

    <div>
        <button id="btn-middle-fetch">Middle Fetch</button>
        <button id="btn-middle-toggle">Toggle Content</button>
    </div>

    <div id="extra-section" class="extra-content hidden">
        <h4>Extra Content Section</h4>
        <p>This section was toggled by the "Toggle Content" button inside the middle iframe. Contains additional text for DOM testing.</p>
    </div>

    <div id="middle-dynamic"></div>

    <script>
        // AUTO: fetch on iframe load — /users/1
        fetch("https://jsonplaceholder.typicode.com/users/1")
            .then(r => r.json())
            .then(data => {
                document.getElementById("middle-dynamic").insertAdjacentHTML(
                    "beforeend",
                    "<p><em>Auto-loaded (middle) user:</em> " + data.name + "</p>"
                );
            });

        // ON-CLICK: fetch /comments/1
        document.getElementById("btn-middle-fetch").addEventListener("click", function () {
            fetch("https://jsonplaceholder.typicode.com/comments/1")
                .then(r => r.json())
                .then(data => {
                    document.getElementById("middle-dynamic").insertAdjacentHTML(
                        "beforeend",
                        "<pre>Middle fetched comment: " + data.name + "</pre>"
                    );
                });
        });

        // ON-CLICK: toggle section
        document.getElementById("btn-middle-toggle").addEventListener("click", function () {
            document.getElementById("extra-section").classList.toggle("hidden");
        });
    </script>
</body>
</html>
