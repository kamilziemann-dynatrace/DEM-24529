<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner iFrame</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #FAFAFA; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin: 5px; }
        pre { background: #f0f0f0; padding: 8px; border-radius: 4px; font-size: 12px; overflow-x: auto; }
        .level-indicator { background: #FCE4EC; border-left: 4px solid #E91E63; padding: 8px 12px; margin: 8px 0; }
        #inner-dynamic { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="level-indicator"><strong>Level 2 — Inner iFrame</strong> (same-origin)</div>
    <h3>Innermost iframe content</h3>

    <div>
        <button id="btn-inner-alert">Click Me</button>
        <button id="btn-inner-fetch">Inner Fetch</button>
    </div>

    <div id="inner-dynamic"></div>

    <script>
        // AUTO: fetch on load — /todos/1
        fetch("https://jsonplaceholder.typicode.com/todos/1")
            .then(r => r.json())
            .then(data => {
                document.getElementById("inner-dynamic").insertAdjacentHTML(
                    "beforeend",
                    "<p><em>Auto-loaded (inner) todo:</em> " + data.title + "</p>"
                );
            });

        // ON-CLICK: alert
        document.getElementById("btn-inner-alert").addEventListener("click", function () {
            alert("Button inside innermost iframe clicked!");
        });

        // ON-CLICK: fetch /photos/1
        document.getElementById("btn-inner-fetch").addEventListener("click", function () {
            fetch("https://jsonplaceholder.typicode.com/photos/1")
                .then(r => r.json())
                .then(data => {
                    document.getElementById("inner-dynamic").insertAdjacentHTML(
                        "beforeend",
                        "<pre>Inner fetched photo: " + JSON.stringify(data, null, 2) + "</pre>"
                    );
                });
        });
    </script>
</body>
</html>
